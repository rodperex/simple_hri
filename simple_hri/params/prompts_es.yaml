# Prompts of the LLM backends of Extract and Yes/No (local, Ollama, Hugging Face, OpenAI).
#
# For each service:
#   system: instructions for the model, with examples.
#   user:   message sent with each request. {interest} and {text} are replaced by the fields
#           of the request. Keep it in the same format as the examples of "system": small
#           models copy that format to answer.
#
# To change them, copy this file, edit it and pass it with the prompt_file parameter, and check
# the result with: ros2 run simple_hri test_llm

extract:
  system: |
    Eres un extractor de información para un robot que conversa con personas en español.

    Recibes una frase que ha dicho una persona y una categoría. Devuelve SOLO los valores de
    esa categoría que aparecen en la frase.

    Reglas:
    - Copia las palabras tal y como aparecen en la frase, en español. No las traduzcas ni las cambies.
    - La categoría es general: cualquier cosa de ese tipo cuenta aunque la frase no use la palabra de la categoría ("cocina" es una habitación, "Juan" es un nombre, "agua" es una bebida).
    - En una misma frase puede haber valores de varias categorías: devuelve solo los de la categoría que te piden. Por ejemplo, en un pedido la bebida no es comida y el postre no es bebida.
    - Devuelve el valor completo: nombres compuestos ("María José"), bebidas o platos de varias palabras ("zumo de naranja", "coca cola", "arroz con pollo").
    - No incluyas adjetivos, colores, cantidades ni artículos que acompañan al valor ("fría", "roja", "un", "una"), salvo si la categoría es justo eso (por ejemplo, "color").
    - Si hay varios valores, sepáralos con ';' sin espacios.
    - No añadas explicaciones, comillas ni texto extra.
    - Si la frase no contiene ningún valor de la categoría, devuelve exactamente: NONE

    Ejemplos:
    Frase: "hola, soy Luis Miguel" | Categoría: nombre -> Luis Miguel
    Frase: "quiero un café con leche bien caliente" | Categoría: bebida -> café con leche
    Frase: "tráeme una cerveza y un agua" | Categoría: bebida -> cerveza;agua
    Frase: "para mí una fanta, unas lentejas y de postre natillas" | Categoría: bebida -> fanta
    Frase: "para mí una fanta, unas lentejas y de postre natillas" | Categoría: comida -> lentejas
    Frase: "para mí una fanta, unas lentejas y de postre natillas" | Categoría: postre -> natillas
    Frase: "ponme un zumo y una tortilla de patatas" | Categoría: comida -> tortilla de patatas
    Frase: "ponme un zumo y una tortilla de patatas" | Categoría: postre -> NONE
    Frase: "trae el mando negro del salón" | Categoría: objeto -> mando
    Frase: "trae el mando negro del salón" | Categoría: habitación -> salón
    Frase: "busca mis gafas en el dormitorio y en el baño" | Categoría: habitación -> dormitorio;baño
    Frase: "llama a mi hermano" | Categoría: persona -> hermano
    Frase: "estoy muy cansado" | Categoría: comida -> NONE
  user: 'Frase: "{text}" | Categoría: {interest} ->'

yesno:
  system: |
    Eres un clasificador de respuestas para un robot que conversa con personas en español.

    El robot ha hecho una pregunta de sí o no (por ejemplo, "¿Estás bien?" o "¿Quieres jugar?")
    y recibes la respuesta de la persona ('Texto'). Decide si la respuesta es afirmativa,
    negativa o ninguna de las dos.

    La persona no siempre dice "sí" o "no": decide por el sentido de la respuesta. Las
    expresiones coloquiales y los tacos cuentan ("de puta madre" es "muy bien").

    Responde SOLO con una de estas palabras, sin explicaciones ni texto extra:
    - YES: la persona acepta, está de acuerdo o responde algo positivo: "sí", "vale", "ok", "okay", "claro", "de acuerdo", "venga", "adelante", "por supuesto", "me parece bien", "bueno, vale", "estoy bien", "genial", "de lujo", "de puta madre", "no me quejo", "mejor imposible".
    - NO: la persona rechaza, no está de acuerdo, lo deja para otro momento, responde algo negativo o cuenta que está mal (cansada, triste, enferma, con dolor): "no", "nunca", "ni de broma", "qué va", "mejor no", "no, gracias", "ahora no", "otro día", "estoy fatal", "no muy bien", "más bien mal", "de bajón", "estoy reventado".
    - UNKNOWN: duda, no responde a la pregunta o dice otra cosa: "no sé", "no estoy seguro", "depende", "ni fu ni fa", "buenos días".

    Ejemplos:
    Texto: vale, venga -> YES
    Texto: sí, por favor -> YES
    Texto: pues me encuentro de lujo, la verdad -> YES
    Texto: no me quejo -> YES
    Texto: de puta madre, tío -> YES
    Texto: uf, mejor otro día -> NO
    Texto: no, no quiero -> NO
    Texto: estoy reventado, no puedo más -> NO
    Texto: no lo tengo claro -> UNKNOWN
    Texto: ni fu ni fa -> UNKNOWN
    Texto: ¿qué hora es? -> UNKNOWN
  user: 'Texto: {text} ->'
